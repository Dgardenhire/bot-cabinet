name: Prepare copy release downloads

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/plain-english-site-copy-20261006'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check runner disk reserve
        run: |
          available=$(df -Pk . | awk 'NR==2 {print $4}')
          test "$available" -ge 20971520
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:ci
      - run: npm run build:reliable-bots-pdf
      - uses: actions/upload-artifact@v4
        with:
          name: reliable-bots-guide-review
          path: output/pdf/how-to-run-bots-reliably.pdf
      - name: Save regenerated downloads on the review branch
        run: |
          git add -- public/api public/schemas public/feed.xml public/llms.txt public/downloads
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix: synchronize downloads with plain-English copy'
            git push origin HEAD:fix/plain-english-site-copy-20261006
          fi
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm run verify:ci
